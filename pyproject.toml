[project]
name = "colab-studio"
version = "0.1.0"
description = "Colab Studio — Self-hosted Google Colab GPU Video Generation Workbench & Cost-Guarded Control Plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx[socks]>=0.28.0",
    "requests>=2.32.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.0",
    "keyring>=25.5.0",
    "websocket-client>=1.8.0",
    "pillow>=11.0.0",
]

[project.scripts]
colab-studio = "backend.main:main"
colab-studio-ssh-proxy = "backend.ssh_bridge:proxy_cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "recipes", "tests"]
